name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package Mac App (.app)
        working-directory: ./macos
        run: |
          tr -d '\r' < package.sh > package_clean.sh
          chmod +x package_clean.sh
          ./package_clean.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDynamicIsland-macOS
          path: ./macos/MacDynamicIsland-macOS.zip

      - name: Attach to GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ./macos/MacDynamicIsland-macOS.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
