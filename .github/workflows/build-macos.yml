name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package Mac App (.app)
        working-directory: ./macos
        run: |
          set -e
          
          echo "=== 1. Building Swift Package ==="
          swift build -c release
          
          echo "=== 2. Locating Release Binary ==="
          BIN_FILE=""
          if [ -f ".build/arm64-apple-macosx/release/MacDynamicIsland" ]; then
            BIN_FILE=".build/arm64-apple-macosx/release/MacDynamicIsland"
          elif [ -f ".build/release/MacDynamicIsland" ]; then
            BIN_FILE=".build/release/MacDynamicIsland"
          else
            BIN_FILE=$(find .build -type f -name "MacDynamicIsland" | grep -v "\.build" | head -n 1 || true)
          fi
          
          echo "Found binary: $BIN_FILE"
          if [ -z "$BIN_FILE" ] || [ ! -f "$BIN_FILE" ]; then
            echo "ERROR: Could not locate MacDynamicIsland binary!"
            find .build -name "*MacDynamicIsland*"
            exit 1
          fi
          
          ls -lh "$BIN_FILE"
          
          echo "=== 3. Creating App Bundle Structure ==="
          rm -rf MacDynamicIsland.app MacDynamicIsland-macOS.zip
          mkdir -p MacDynamicIsland.app/Contents/MacOS
          mkdir -p MacDynamicIsland.app/Contents/Resources
          
          cp -p "$BIN_FILE" MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          chmod +x MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          
          # Verify binary copied and non-empty
          if [ ! -s MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland ]; then
            echo "ERROR: MacDynamicIsland executable in app bundle is missing or empty!"
            ls -la MacDynamicIsland.app/Contents/MacOS/
            exit 1
          fi
          
          echo "=== 4. Adding Info.plist ==="
          cp Info.plist MacDynamicIsland.app/Contents/Info.plist
          
          echo "=== 5. Codesigning ==="
          codesign --force --deep --sign - MacDynamicIsland.app || true
          
          echo "=== 6. Packaging with ditto ==="
          ditto -c -k --sequesterRsrc --keepParent MacDynamicIsland.app MacDynamicIsland-macOS.zip
          
          # Verify zip created and non-empty (> 50KB)
          ls -lh MacDynamicIsland-macOS.zip
          ZIP_SIZE=$(stat -f%z MacDynamicIsland-macOS.zip 2>/dev/null || stat -c%s MacDynamicIsland-macOS.zip)
          echo "Created zip of size: $ZIP_SIZE bytes"
          if [ "$ZIP_SIZE" -lt 50000 ]; then
            echo "ERROR: Zip file is suspiciously small ($ZIP_SIZE bytes), packaging failed!"
            exit 1
          fi
          
          echo "=== PACKAGING COMPLETE ==="

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacDynamicIsland-macOS
          path: ./macos/MacDynamicIsland-macOS.zip
          if-no-files-found: warn

      - name: Attach to GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ./macos/MacDynamicIsland-macOS.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
