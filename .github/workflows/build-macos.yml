name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package Mac App (.app)
        working-directory: ./macos
        run: |
          set -e
          
          echo "=== 1. Building Swift Package (Release) ==="
          swift build -c release 2>&1 | tee build_output.txt || {
            echo "::error title=SwiftBuildFailure::Swift build failed!"
            tail -n 30 build_output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          
          echo "=== 2. Creating .app Bundle Structure ==="
          rm -rf MacDynamicIsland.app MacDynamicIsland-macOS.zip
          mkdir -p MacDynamicIsland.app/Contents/MacOS
          mkdir -p MacDynamicIsland.app/Contents/Resources
          
          echo "=== 3. Locating and Copying Executable ==="
          BIN_PATH=$(swift build -c release --show-bin-path | tail -n 1 | tr -d '\r')
          echo "::notice::SPM bin path: $BIN_PATH"
          
          FOUND_BIN=""
          if [ -f "$BIN_PATH/MacDynamicIsland" ]; then
            FOUND_BIN="$BIN_PATH/MacDynamicIsland"
          fi
          
          if [ -z "$FOUND_BIN" ]; then
            for f in $(find .build -type f); do
              if [ -x "$f" ] && [[ "$f" != *".build/"*"/MacDynamicIsland.build/"* ]] && [[ "$f" != *".sh" ]]; then
                echo "::notice::Found candidate binary: $f"
                FOUND_BIN="$f"
                break
              fi
            done
          fi
          
          echo "::notice::Selected executable: $FOUND_BIN"
          if [ -z "$FOUND_BIN" ] || [ ! -f "$FOUND_BIN" ]; then
            echo "::error::Executable binary could not be found anywhere in .build!"
            exit 1
          fi
          
          cp -v "$FOUND_BIN" MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          chmod +x MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          ls -la MacDynamicIsland.app/Contents/MacOS/
          
          echo "=== 4. Copying Info.plist ==="
          cp -v Info.plist MacDynamicIsland.app/Contents/Info.plist
          
          echo "=== 5. Codesigning ==="
          codesign --force --deep --sign - MacDynamicIsland.app || true
          
          echo "=== 6. Archiving Bundle ==="
          ditto -c -k --sequesterRsrc --keepParent MacDynamicIsland.app MacDynamicIsland-macOS.zip
          ls -lh MacDynamicIsland-macOS.zip
          
          echo "=== 7. Verifying Archive ==="
          test -f MacDynamicIsland-macOS.zip
          echo "Build & Packaging Successful!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDynamicIsland-macOS
          path: ./macos/MacDynamicIsland-macOS.zip

      - name: Attach to GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ./macos/MacDynamicIsland-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
