name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package Mac App (.app)
        working-directory: ./macos
        run: |
          set -e
          
          echo "=== 1. Building Swift Package Product ==="
          swift build -c release
          
          echo "=== 2. Creating .app Bundle Structure ==="
          rm -rf MacDynamicIsland.app MacDynamicIsland-macOS.zip
          mkdir -p MacDynamicIsland.app/Contents/MacOS
          mkdir -p MacDynamicIsland.app/Contents/Resources
          
          echo "=== 3. Copying Binary ==="
          if [ -f ".build/arm64-apple-macosx/release/MacDynamicIsland" ]; then
            cp -v .build/arm64-apple-macosx/release/MacDynamicIsland MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          elif [ -f ".build/release/MacDynamicIsland" ]; then
            cp -v .build/release/MacDynamicIsland MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          else
            find .build -type f -name "MacDynamicIsland" -exec cp -v {} MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland \;
          fi
          
          chmod +x MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          ls -la MacDynamicIsland.app/Contents/MacOS/
          
          echo "=== 4. Copying Info.plist ==="
          cp -v Info.plist MacDynamicIsland.app/Contents/Info.plist
          
          echo "=== 5. Codesigning ==="
          codesign --force --deep --sign - MacDynamicIsland.app || true
          
          echo "=== 6. Archiving Bundle ==="
          ditto -c -k --sequesterRsrc --keepParent MacDynamicIsland.app MacDynamicIsland-macOS.zip
          ls -lh MacDynamicIsland-macOS.zip
          
          echo "=== 7. Verifying Archive ==="
          test -f MacDynamicIsland-macOS.zip
          echo "Build & Packaging Successful!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDynamicIsland-macOS
          path: ./macos/MacDynamicIsland-macOS.zip

      - name: Attach to GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ./macos/MacDynamicIsland-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
