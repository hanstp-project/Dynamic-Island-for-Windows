name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Swift Package Manager
        working-directory: ./macos
        run: |
          swift build -c release 2>&1 | tee build_output.txt || (echo "=== SWIFT BUILD FAILURE ===" && cat build_output.txt && exit 1)

      - name: Create Mac App Bundle (.app)
        working-directory: ./macos
        run: |
          set -e
          rm -rf MacDynamicIsland.app MacDynamicIsland-macOS.zip
          
          # Find compiled binary
          EXEC_PATH=""
          if [ -f ".build/arm64-apple-macosx/release/MacDynamicIsland" ]; then
            EXEC_PATH=".build/arm64-apple-macosx/release/MacDynamicIsland"
          elif [ -f ".build/release/MacDynamicIsland" ]; then
            EXEC_PATH=".build/release/MacDynamicIsland"
          else
            EXEC_PATH=$(find .build -type f -name "MacDynamicIsland" | head -n 1)
          fi
          
          echo "Found binary at: $EXEC_PATH"
          if [ -z "$EXEC_PATH" ] || [ ! -f "$EXEC_PATH" ]; then
            echo "Error: MacDynamicIsland binary not found!"
            find .build -name "*MacDynamicIsland*"
            exit 1
          fi
          
          mkdir -p MacDynamicIsland.app/Contents/MacOS
          mkdir -p MacDynamicIsland.app/Contents/Resources
          
          cp "$EXEC_PATH" MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          chmod +x MacDynamicIsland.app/Contents/MacOS/MacDynamicIsland
          
          cp Info.plist MacDynamicIsland.app/Contents/Info.plist
          
          codesign --force --deep --sign - MacDynamicIsland.app || true
          
          zip -r MacDynamicIsland-macOS.zip MacDynamicIsland.app
          ls -lh MacDynamicIsland-macOS.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDynamicIsland-macOS
          path: ./macos/MacDynamicIsland-macOS.zip

      - name: Attach to GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ./macos/MacDynamicIsland-macOS.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
